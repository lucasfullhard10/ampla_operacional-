<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Lime green to deep vibrant green gradient -->
    <linearGradient id="amplaGreenGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#99DD3C" />
      <stop offset="40%" stop-color="#76C72B" />
      <stop offset="100%" stop-color="#4AA81E" />
    </linearGradient>

    <!-- Sky blue to deep ocean blue gradient -->
    <linearGradient id="amplaBlueGrad" x1="0" y1="0.8" x2="1" y2="0.2">
      <stop offset="0%" stop-color="#027CB5" />
      <stop offset="60%" stop-color="#00A7E1" />
      <stop offset="100%" stop-color="#00BBE4" />
    </linearGradient>

    <!-- Medium blue shadow gradient for the inner curves -->
    <linearGradient id="amplaBlueDarkGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#015D8C" />
      <stop offset="100%" stop-color="#028CB8" />
    </linearGradient>
  </defs>

  <!-- The stylized "A" icon -->
  <g transform="translate(0, 4)">
    <!-- 1. LEFT GREEN STRIP (Upper Peak down to Bottom-Left, bending into the base) -->
    <path d="M 50,11 
             C 48.5,11 47.1,11.8 46.3,13.1 
             L 30.8,40.1 
             C 34.5,43.5 39.1,45.5 44.5,45.5
             C 48.2,45.5 51.5,44.3 54.2,42.2
             L 41.5,20.2
             L 50,11 Z" 
          fill="#76C72B" 
          opacity="0.15" />

    <!-- Actual Green Leg -->
    <path d="M 50,11 
             C 48.5,11 47.1,11.8 46.3,13.1 
             L 30.8,40.1
             C 30.8,40.1 35.5,43.5 41.5,43.5
             C 46.5,43.5 50.5,40.5 52.5,37.0
             L 41.5,18.0
             L 50,11 Z"
          fill="url(#amplaGreenGrad)" />

    <!-- Complete Green Ribbon curving to the bottom left -->
    <path d="M 46.3,13.1
             L 30.8,40.1
             C 27.0,46.7 23.2,53.3 19.4,59.9
             C 18.4,61.6 19.6,63.8 21.6,63.8
             L 43.5,63.8
             C 51.0,63.8 55.0,59.5 55.0,55.0
             C 55.0,50.5 50.0,47.5 43.5,47.5
             L 34.0,47.5
             C 35.5,44.5 38.5,42.0 42.0,42.0
             C 47.0,42.0 51.0,45.0 53.5,49.0
             L 60.5,37.0
             C 56.5,30.0 51.5,23.0 46.3,13.1 Z"
          fill="url(#amplaGreenGrad)" />

    <!-- 2. BOTTOM BLUE BASE (Left-to-Right segment) -->
    <path d="M 19.4,59.9
             C 19.4,59.9 22.0,55.0 28.0,55.0
             L 58.0,55.0
             C 56.5,58.0 54.0,60.5 51.0,62.0
             L 24.0,62.0
             C 21.0,62.0 19.4,59.9 19.4,59.9 Z"
          fill="url(#amplaBlueDarkGrad)" />

    <!-- Blue lower triangle connecting and curving up -->
    <path d="M 21.0,63.8
             L 59.0,63.8
             C 61.5,63.8 63.5,62.5 64.5,60.5
             L 57.0,47.5
             C 54.0,51.0 49.5,53.5 43.5,53.5
             L 30.0,53.5
             C 25.0,53.5 22.0,56.5 21.0,59.9
             L 21.0,63.8 Z"
          fill="url(#amplaBlueGrad)" />

    <!-- 3. RIGHT BLUE LEG (Sleek angled stroke with inner negative space) -->
    <path d="M 57.0,29.0
             C 56.0,29.0 55.1,29.5 54.6,30.4
             L 47.5,42.7
             C 51.0,45.5 55.5,47.5 59.5,47.5
             C 63.5,47.5 67.0,45.0 69.5,41.0
             L 60.5,25.5
             C 59.5,27.5 58.5,29.0 57.0,29.0 Z"
          fill="url(#amplaBlueDarkGrad)" opacity="0.3" />

    <path d="M 57.0,29.0
             C 58.5,29.0 59.5,29.8 60.1,31.0
             L 70.8,49.5
             C 71.8,51.2 71.0,53.5 69.0,53.5
             L 62.5,53.5
             C 61.5,53.5 60.5,52.8 60.0,52.0
             L 54.0,41.5
             C 53.0,39.8 53.8,37.5 55.8,37.5
             L 58.5,37.5
             C 59.5,37.5 60.0,36.5 59.5,35.5
             L 56.0,29.5
             C 56.5,29.2 56.8,29.0 57.0,29.0 Z"
          fill="url(#amplaBlueGrad)" />
  </g>
</svg>
